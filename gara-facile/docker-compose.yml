# Local: cp .env.example .env (fill keys) && docker compose up --build
# Dokploy: create a Compose service pointing at this file (gara-facile/), set the
# variables from .env.example in the Environment tab and the domain on port 3000.
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Container paths; persisted in the volumes below.
      DB_FILE_NAME: /app/data/gara.db
      FILES_STORAGE_PROVIDER: ${FILES_STORAGE_PROVIDER:-local}
      FILES_LOCAL_DIR: /app/var/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - gara-data:/app/data
      - gara-uploads:/app/var/uploads
      - gara-evolus:/app/var/evolus
    healthcheck:
      # Home page only: /api/ai/health calls the model provider and spends rate limit.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  gara-data:
  gara-uploads:
  gara-evolus:
